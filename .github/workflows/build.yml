name: build

# Compiles the plugin for Revit 2025 on GitHub's Windows runners (NuGet reachable there)
# and uploads the built add-in as an artifact, ready to copy into
# %AppData%\Autodesk\Revit\Addins\2025\.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-r25:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (Release.R25)
        run: >
          dotnet build OaAecMcpPlugin/OaAecMcpPlugin.csproj
          -c Release.R25
          -p:DeployAddin=false
          -p:LaunchRevit=false
          -warnaserror:CS8602,CS8604

      - name: Upload add-in
        uses: actions/upload-artifact@v4
        with:
          name: OaAecMcpPlugin-Revit2025
          path: |
            OaAecMcpPlugin/bin/**
            OaAecMcpPlugin/OaAecMcpPlugin.addin
          if-no-files-found: error
